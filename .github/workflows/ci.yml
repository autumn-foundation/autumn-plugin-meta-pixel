name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - name: Rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      # `+1.88.0` wins over rust-toolchain.toml.
      - run: cargo +1.88.0 check --all-targets

  test:
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage (fail under 85% lines)
        run: cargo llvm-cov --all-targets --fail-under-lines 85 --lcov --output-path lcov.info
      - name: Doc tests
        run: cargo test --doc
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/js/*.test.mjs

  e2e:
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --example app
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser test
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/e2e/browser.mjs

  verus:
    runs-on: ubuntu-latest
    env:
      # Same build as local: Verus from source at a pinned commit, z3 from PyPI.
      VERUS_REV: 2c9bf54cfa6391ee3769f23d8d173b96a0b70560
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            verus-src
          key: verus-${{ env.VERUS_REV }}-z3-4.16.0.0
      - name: Build Verus
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p verus-src && cd verus-src
          git init -q
          git fetch -q --depth 1 https://github.com/verus-lang/verus "$VERUS_REV"
          git checkout -q FETCH_HEAD
          pip download -q --no-deps z3-solver==4.16.0.0 -d /tmp/z3
          python3 -m zipfile -e /tmp/z3/*.whl /tmp/z3/x
          cp /tmp/z3/x/z3_solver-4.16.0.0.data/data/bin/z3 source/z3
          chmod +x source/z3
          cd source
          rustup toolchain install
          bash -c 'source ../tools/activate && vargo build --release'
      - name: Install the Verus toolchain
        if: steps.cache.outputs.cache-hit == 'true'
        run: cd verus-src/source && rustup toolchain install
      - name: Verify policy spec
        run: |
          VERUS_Z3_PATH="$PWD/verus-src/source/z3" \
            verus-src/source/target-verus/release/verus verus/policy.rs
