[package]
name = "autumn-plugin-meta-pixel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Meta Pixel plugin for autumn-web: consent-gated, CSP-safe pixel loader served as a plugin asset, with typed events"
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-meta-pixel"
readme = "README.md"
keywords = ["autumn", "meta-pixel", "facebook-pixel", "analytics", "plugin"]
categories = ["web-programming"]
exclude = [".github/", ".githooks/", "docs/", "verus/", "tests/js/", "tests/e2e/", "rust-toolchain.toml", "CLAUDE.md", "clippy.toml", "proptest-regressions/"]

[dependencies]
# `maud` gives the `PluginAssets` tag helpers. The host app picks the rest.
autumn-web = { version = "0.8.0", default-features = false, features = ["maud"] }
# `maud::html!` expands to `::maud::...` paths. Use the maud version of autumn-web.
maud = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
# `htmx` serves htmx.min.js for the example app.
autumn-web = { version = "0.8.0", default-features = false, features = ["maud", "htmx"] }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# `pub(crate)` marks crate-internal items on purpose.
redundant_pub_crate = "allow"
